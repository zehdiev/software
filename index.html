<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a35">
<meta name="description" content="Уроци и упражнения по Windows, File Explorer, Word, Excel и PowerPoint – курс „Административни и офис дейности“">
<title>Офис програми – упражнения</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3efe6;--ink:#1f2a35;--blue:#2b6a8a;--orange:#b5501f;--ok:#2e7d4f;--line:#d9d2c3;--muted:#6b6457;--mc:#2b6a8a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit}
h1,h2,h3{font-family:Montserrat,Inter,system-ui,sans-serif}
.topbar{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar .back{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:14px}
.topbar .ttl{font:700 16px Montserrat,sans-serif;line-height:1.2;flex:1;min-width:0}
.topbar .ttl small{display:block;font:400 12px Inter,sans-serif;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .devsw{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:16px}
.applogo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 22px Montserrat,sans-serif;flex:0 0 auto}
/* начало */
.hero{padding:8px 0 16px}
.hero h1{font-size:24px;margin:0 0 6px}
.hero p{margin:0;color:var(--muted)}
.mods{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.modcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;color:inherit;transition:transform .1s}
.modcard:hover{transform:translateY(-2px)}
.modcard .row{display:flex;gap:12px;align-items:center}
.modcard h2{margin:0;font-size:18px}
.modcard .sub{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.small{font-size:13px;color:var(--muted)}
.note{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px;color:var(--muted)}
/* модул */
.lessons{display:grid;gap:10px}
.lrow{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:inherit;font-size:15px}
.lrow .n{width:32px;height:32px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.lrow.done .n{background:var(--ok);color:#fff}
.lrow .t{flex:1}
.lrow .t b{display:block}
.lrow .t span{font-size:12px;color:var(--muted)}
/* урок */
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--blue);text-decoration:none}
.lhead h1{font-size:22px;margin:0 0 4px}
.plan{display:inline-block;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--muted);margin-bottom:12px}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.layout>*{min-width:0}
@media(min-width:980px){.layout{grid-template-columns:360px minmax(0,1fr);align-items:start}.taskcol{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.theory summary{font:700 15px Montserrat,sans-serif;cursor:pointer;color:var(--blue)}
.theory ul{padding-left:20px;margin:8px 0 0}
.theory li{margin:4px 0}
.goal{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.goal .k{font:700 12px Montserrat,sans-serif;color:var(--orange);text-transform:uppercase;letter-spacing:.05em}
.goal p{margin:4px 0 0}
.goal ul{margin:6px 0 0;padding-left:20px}
.howto{margin-top:12px}
.howto h4{margin:0 0 6px;font-size:14px}
.dev{display:flex;background:var(--paper);border-radius:8px;padding:3px;margin-bottom:8px}
.dev button{flex:1;border:0;background:none;padding:7px;border-radius:6px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
.dev button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
ol.steps{margin:0;padding-left:20px;font-size:14px}
ol.steps li{margin:3px 0}
kbd{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 5px;font:600 12px Inter,sans-serif;white-space:nowrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.next{background:var(--ok);color:#fff}
.feedback{margin-top:12px;padding:12px 14px;border-radius:8px;display:none;font-size:15px}
.feedback.ok{display:block;background:#e5f3ea;color:#1d5a37}
.feedback.bad{display:block;background:#fbeee6;color:#7a3412}
.feedback ul{margin:4px 0 0;padding-left:20px}
.jump{display:none;text-decoration:none}
@media(max-width:979px){.jump{display:inline-block}}
.simlabel{font-size:13px;color:var(--muted);margin:0 0 6px}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* ---------- общи за симулаторите ---------- */
.app{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.rtabs{display:flex;gap:2px;padding:6px 8px 0;color:#fff;overflow-x:auto;scrollbar-width:none}
.rtabs button{background:none;border:0;color:#fff;opacity:.75;padding:6px 10px 8px;font-size:14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.rtabs button.on{opacity:1;font-weight:600;border-bottom-color:#fff}
.rtabs .fname{margin-left:auto;opacity:.8;font-size:13px;padding:6px 8px;white-space:nowrap}
.tbar{display:flex;gap:3px;padding:6px;background:#f6f6f6;border-bottom:1px solid #ddd;overflow-x:auto;align-items:center;min-height:56px}
.tbar button{flex:0 0 auto;min-width:40px;height:42px;border:1px solid transparent;background:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;color:#222;padding:0 8px;font-size:13px}
.tbar button:hover{background:#e6e6e6}
.tbar button.on{background:#dfe7f3;border-color:#b6c7e2}
.tbar .sep{width:1px;background:#ccc;align-self:stretch;margin:6px 3px;flex:0 0 1px}
.tbar svg{width:20px;height:20px;flex:0 0 auto}
.tbar .t{font:700 18px Georgia,serif}
.pop{position:absolute;z-index:30;background:#fff;border:1px solid #bbb;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:10px;font-size:14px;max-width:calc(100% - 16px)}
.pop h5{margin:0 0 8px;font-size:14px}
.pop .grid{display:grid;gap:4px}
.pop button{border:1px solid #ccc;background:#fafafa;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:14px}
.pop button:hover{background:#eef3fb}
.pop input,.pop select,.pop textarea{font:inherit;padding:6px 8px;border:1px solid #bbb;border-radius:6px;width:100%}
.pop label{display:block;margin:6px 0 2px;font-size:13px;color:#444}
.pop .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop .x{float:right;border:0;background:none;font-size:18px;padding:0 4px;line-height:1}

</style>
</head>
<body>
<div id="root"></div>
<script>
/* ===== Ядро: навигация, прогрес, уроци ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('aodsoft:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('aodsoft:'+k,JSON.stringify(v))}catch(e){}}
};
const MODS=[];
function addModule(m){MODS.push(m)}
let progress=store.get('progress',{});
let device=store.get('device',null)||((matchMedia('(pointer:coarse)').matches||innerWidth<700)?'phone':'pc');
let current=null; // {mod, idx, api}

function toast(msg,ms=2200){let t=$('.toast');if(!t){t=el('<div class="toast"></div>');document.body.appendChild(t)}t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms)}

// Затваря изскачащи прозорци при щракване другаде
document.addEventListener('pointerdown',e=>{$$('.pop').forEach(p=>{if(!p.contains(e.target)&&!(p._owner&&p._owner.contains(e.target)))p.remove()})},true);
// Показва изскачащ прозорец под бутон, вътре в контейнер
function popup(owner,container,html){
  $$('.pop',container).forEach(p=>p.remove());
  const p=el(`<div class="pop">${html}</div>`);p._owner=owner;container.appendChild(p);
  const cr=container.getBoundingClientRect(),br=owner.getBoundingClientRect();
  let left=br.left-cr.left;const top=br.bottom-cr.top+4;
  p.style.top=top+'px';p.style.left='8px';
  const w=p.offsetWidth;left=Math.max(8,Math.min(left,cr.width-w-8));p.style.left=left+'px';
  p.querySelectorAll('button').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault())});
  const x=p.querySelector('.x');if(x)x.onclick=()=>p.remove();
  return p;
}
// Лента с раздели (като в Office). tabs: [{name, tools:[{id,html,title,run}]}]
function ribbon(app,color,tabs,fname,startTab){
  const head=el(`<div class="rtabs" style="background:${color}"></div>`);
  const bar=el('<div class="tbar"></div>');
  let cur=startTab!=null?startTab:tabs.findIndex(t=>t.tools.length);
  tabs.forEach((t,i)=>{const b=el(`<button>${t.name}</button>`);b.onclick=()=>{cur=i;draw()};head.appendChild(b)});
  if(fname)head.appendChild(el(`<span class="fname">${esc(fname)}</span>`));
  function draw(){
    $$('button',head).forEach((b,i)=>b.classList.toggle('on',i===cur));
    bar.innerHTML='';
    const tools=tabs[cur].tools;
    if(!tools.length)bar.appendChild(el('<span class="small" style="padding:0 8px">В този раздел няма нужни инструменти за задачата.</span>'));
    tools.forEach(t=>{
      if(t==='|'){bar.appendChild(el('<span class="sep"></span>'));return}
      const b=el(`<button title="${esc(t.title||'')}" data-tool="${t.id}">${t.html}</button>`);
      b.addEventListener('pointerdown',e=>{if(!t.focusable)e.preventDefault()});
      b.addEventListener('mousedown',e=>{if(!t.focusable)e.preventDefault()});
      b.onclick=e=>t.run(b,e);
      if(t.active)b._active=t.active;
      bar.appendChild(b);
    });
    refresh();
  }
  function refresh(){$$('button',bar).forEach(b=>{if(b._active)b.classList.toggle('on',!!b._active())})}
  app.appendChild(head);app.appendChild(bar);draw();
  return {refresh,select(name){const i=tabs.findIndex(t=>t.name===name);if(i>=0){cur=i;draw()}}};
}

/* ---------- маршрути ---------- */
function go(hash){if(location.hash==='#'+hash||(!hash&&!location.hash))route();else location.hash=hash}
window.addEventListener('hashchange',route);
function route(){
  const h=location.hash.slice(1);
  const m=h.match(/^([a-z]+)(?:-(\d+))?$/);
  const mod=m&&MODS.find(x=>x.id===m[1]);
  if(!mod)return home();
  if(m[2]){const i=+m[2]-1;if(mod.lessons[i])return lesson(mod,i)}
  modulePage(mod);
}
function topbar(title,sub,back){
  return `<div class="topbar">${back?`<button class="back" onclick="go('${back}')">← Назад</button>`:''}<div class="ttl">${title}<small>${sub||''}</small></div><button class="devsw" id="devsw" title="Смени вида на инструкциите">${device==='phone'?'Телефон':'Компютър'}</button></div>`;
}
function wireDev(){const b=$('#devsw');if(b)b.onclick=()=>{setDevice(device==='phone'?'pc':'phone')}}
function setDevice(d){device=d;store.set('device',d);if(current&&current.redrawSteps){current.redrawSteps();const b=$('#devsw');if(b)b.textContent=device==='phone'?'Телефон':'Компютър'}else route()}
function modDone(m){return m.lessons.filter(l=>progress[l.id]).length}

function home(){
  current=null;
  const root=$('#root');
  const total=MODS.reduce((a,m)=>a+m.lessons.length,0),done=MODS.reduce((a,m)=>a+modDone(m),0);
  root.innerHTML=topbar('Офис програми','Административни и офис дейности')+`<main>
    <div class="hero"><h1>Научете офис програмите стъпка по стъпка</h1>
    <p>Всеки урок има кратко обяснение, указания за телефон и компютър и упражнение, което се проверява веднага.</p></div>
    <div class="mods">${MODS.map(m=>`<button class="modcard" onclick="go('${m.id}')">
      <div class="row"><div class="applogo" style="background:${m.color}">${m.letter}</div><div><h2>${m.name}</h2><div class="sub">${m.sub}</div></div></div>
      <div class="bar"><i style="width:${Math.round(modDone(m)/m.lessons.length*100)}%"></i></div>
      <div class="small">${modDone(m)} от ${m.lessons.length} урока</div></button>`).join('')}</div>
    <div class="note">Общо изпълнени: <b>${done} от ${total}</b> упражнения. Напредъкът се пази на това устройство.
    Приложението работи и без интернет, след като веднъж е отворено. В Chrome изберете „Инсталиране“ или „Добавяне към началния екран“.
    <div class="actions"><button class="btn ghost" id="resetall">Изчисти напредъка</button></div></div>
  </main>`;
  wireDev();
  $('#resetall').onclick=e=>{if(e.target.dataset.sure){progress={};store.set('progress',progress);home()}else{e.target.dataset.sure=1;e.target.textContent='Натиснете пак за потвърждение'}};
  scrollTo(0,0);
}
function modulePage(m){
  current=null;
  $('#root').innerHTML=topbar(m.name,m.sub,'')+`<main>
   <div class="hero"><div style="display:flex;gap:12px;align-items:center"><div class="applogo" style="background:${m.color}">${m.letter}</div><div><h1 style="margin:0">${m.name}</h1><p>${m.intro}</p></div></div></div>
   <div class="lessons">${m.lessons.map((l,i)=>`<button class="lrow ${progress[l.id]?'done':''}" onclick="go('${m.id}-${i+1}')"><span class="n">${progress[l.id]?'✓':i+1}</span><span class="t"><b>${l.title}</b><span>${l.plan}</span></span><span>›</span></button>`).join('')}</div>
  </main>`;
  wireDev();scrollTo(0,0);
}
function lesson(m,i){
  const L=m.lessons[i];
  $('#root').innerHTML=topbar(m.name,`Урок ${i+1} от ${m.lessons.length}: ${L.title}`,m.id)+`<main>
   <div class="lhead"><div class="crumb"><a href="#">Начало</a> › <a href="#${m.id}">${m.name}</a> › Урок ${i+1}</div><h1>${L.title}</h1><span class="plan">По учебния план: ${L.plan}</span></div>
   <div class="layout">
    <div class="taskcol"><div class="card">
      <details class="theory" ${device==='pc'?'open':''}><summary>Какво трябва да знаете</summary>${L.theory}</details>
      <div class="goal"><div class="k">Задача</div>${L.goal}</div>
      <div class="howto"><h4>Как става в истинската програма</h4>
        <div class="dev"><button data-d="phone">На телефон</button><button data-d="pc">На компютър</button></div>
        <ol class="steps" id="steps"></ol></div>
      <div class="actions"><button class="btn primary" id="check">Провери</button><button class="btn ghost" id="reset">Отначало</button><a class="btn ghost jump" href="javascript:void(0)" id="jump">Към упражнението ↓</a></div>
      <div class="feedback" id="fb"></div>
    </div></div>
    <div><p class="simlabel" id="simtop">Упражнение – работете тук:</p><div id="sim"></div>
      <div class="lnav">${i>0?`<button class="btn ghost" onclick="go('${m.id}-${i}')">← Предишен</button>`:'<span></span>'}${i<m.lessons.length-1?`<button class="btn ghost" onclick="go('${m.id}-${i+2}')">Следващ →</button>`:`<button class="btn ghost" onclick="go('${m.id}')">Към уроците</button>`}</div>
    </div>
   </div></main>`;
  wireDev();
  const redrawSteps=()=>{
    $$('.dev button').forEach(b=>b.classList.toggle('on',b.dataset.d===device));
    const st=device==='phone'?(L.phone||m.phoneNote):L.pc;
    $('#steps').innerHTML=(Array.isArray(st)?st:[st]).map(s=>`<li>${s}</li>`).join('');
  };
  $$('.dev button').forEach(b=>b.onclick=()=>setDevice(b.dataset.d));
  const start=()=>{const host=$('#sim');host.innerHTML='';$('#fb').className='feedback';current.api=L.sim(host)||{}};
  current={mod:m,idx:i,redrawSteps,api:null};
  redrawSteps();start();
  $('#reset').onclick=start;
  $('#jump').onclick=()=>$('#simtop').scrollIntoView({behavior:'smooth'});
  $('#check').onclick=()=>{
    const fb=$('#fb');let errs;
    try{errs=L.check(current.api)}catch(e){console.error(e);errs=['Нещо не е наред с проверката. Опитайте „Отначало“.']}
    if(!errs.length){
      progress[L.id]=true;store.set('progress',progress);
      fb.className='feedback ok';
      const last=i===m.lessons.length-1;
      fb.innerHTML=`<b>${['Точно така!','Браво!','Отлично!','Чудесно!'][i%4]}</b> Задачата е изпълнена.${L.after?`<div style="margin-top:6px">${L.after}</div>`:''}<div class="actions"><button class="btn next" id="nx">${last?'Към уроците':'Следващ урок →'}</button></div>`;
      $('#nx').onclick=()=>go(last?m.id:`${m.id}-${i+2}`);
    }else{
      fb.className='feedback bad';
      fb.innerHTML='<b>Още малко:</b><ul>'+errs.map(x=>`<li>${x}</li>`).join('')+'</ul>';
    }
    if(innerWidth<980)fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  scrollTo(0,0);
}

/* ===== Модул: Windows и File Explorer ===== */
const WIN_CSS=`
.desk{position:relative;height:560px;background:linear-gradient(135deg,#1d4e89,#3a7bd5 55%,#7fb2e5);border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none;font-size:14px}
@media(max-width:600px){.desk{height:600px}}
.dicons{position:absolute;left:8px;top:8px;display:grid;gap:6px}
.dicon{width:76px;text-align:center;color:#fff;font-size:12px;padding:4px;border-radius:6px;cursor:pointer;text-shadow:0 1px 2px #000;background:none;border:0}
.dicon:hover{background:rgba(255,255,255,.18)}
.dicon svg{width:40px;height:40px;display:block;margin:0 auto 2px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(243,243,243,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;gap:4px;border-top:1px solid #ccc}
.taskbar .tb{width:42px;height:40px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center;position:relative}
.taskbar .tb:hover{background:rgba(0,0,0,.07)}
.taskbar .tb svg{width:26px;height:26px}
.taskbar .tb.run:after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:#888}
.taskbar .tb.act:after{width:16px;background:#0067c0}
.taskbar .clock{position:absolute;right:10px;font-size:11px;text-align:right;line-height:1.3;color:#222}
.startm{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 16px));background:rgba(248,248,248,.97);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:16px;z-index:40}
.startm input{width:100%;padding:9px 12px;border-radius:20px;border:1px solid #ccc;font:inherit;margin-bottom:12px}
.startm h6{margin:4px 0 8px;font-size:13px}
.startm .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.startm .apps button{border:0;background:none;border-radius:6px;padding:8px 2px;cursor:pointer;font-size:11px;color:#222}
.startm .apps button:hover{background:rgba(0,0,0,.06)}
.startm .apps svg{width:32px;height:32px;display:block;margin:0 auto 4px}
.startm .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;margin-top:12px;padding-top:10px;font-size:13px}
.wwin{position:absolute;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.wwin.max{left:0!important;top:0!important;right:0!important;bottom:48px!important;width:auto!important;height:auto!important;border-radius:0}
.wwin.min{display:none}
.wtitle{height:36px;display:flex;align-items:center;background:#f3f3f3;border-bottom:1px solid #e3e3e3;padding-left:10px;gap:8px;font-size:13px;flex:0 0 auto}
.wtitle svg{width:18px;height:18px}
.wtitle .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle .wb{width:46px;height:36px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.wtitle .wb:hover{background:#e0e0e0}
.wtitle .wb.cl:hover{background:#c42b1c;color:#fff}
.wbody{flex:1;overflow:auto;position:relative}
/* Explorer */
.xp{display:flex;flex-direction:column;height:100%;font-size:13px;position:relative}
.xp .addr{display:flex;gap:4px;padding:6px;align-items:center;border-bottom:1px solid #eee}
.xp .addr button.nav{width:30px;height:30px;border:0;background:none;border-radius:4px;cursor:pointer;font-size:15px}
.xp .addr button.nav:hover{background:#eee}
.xp .crumbs{flex:1;border:1px solid #ccc;border-radius:4px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.xp .crumbs span{cursor:pointer}.xp .crumbs span:hover{text-decoration:underline}
.xp .search{width:150px;border:1px solid #ccc;border-radius:4px;padding:5px 8px;font:inherit;min-width:0}
.xp .cmd{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid #eee;overflow-x:auto;flex:0 0 auto}
.xp .cmd button{border:0;background:none;border-radius:4px;padding:6px 8px;cursor:pointer;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:4px;color:#222}
.xp .cmd button:hover{background:#eee}
.xp .cmd button:disabled{opacity:.35;cursor:default;background:none}
.xp .cmd svg{width:16px;height:16px}
.xp .main{flex:1;display:flex;min-height:0}
.xp .navp{width:150px;border-right:1px solid #eee;padding:6px 4px;overflow:auto;flex:0 0 auto}
.xp .navp button{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:12px;text-align:left}
.xp .navp button:hover,.xp .navp button.on{background:#e5f0fb}
.xp .navp svg{width:16px;height:16px;flex:0 0 auto}
.xp .list{flex:1;overflow:auto;min-width:0}
.xp .row{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:default;border:1px solid transparent}
.xp .row:hover{background:#f2f7fd}
.xp .row.sel{background:#cce4f7;border-color:#99c9ef}
.xp .row.drop{outline:2px dashed #0067c0}
.xp .row input[type=checkbox]{margin:0;width:16px;height:16px}
.xp .row svg{width:20px;height:20px;flex:0 0 auto}
.xp .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp .row .ty,.xp .row .dt{width:110px;color:#666;font-size:12px;white-space:nowrap;overflow:hidden}
.xp .row .ren{flex:1;font:inherit;padding:2px 4px;border:1px solid #0067c0}
.xp .hdr{display:flex;gap:8px;padding:4px 8px 4px 32px;color:#666;font-size:12px;border-bottom:1px solid #eee}
.xp .hdr .nm{flex:1}.xp .hdr .ty,.xp .hdr .dt{width:110px}
.xp .status{font-size:12px;color:#555;padding:4px 8px;border-top:1px solid #eee}
.xp .empty{padding:20px;color:#888;text-align:center}
.xp .navchips{display:none;gap:4px;padding:6px;overflow-x:auto;border-bottom:1px solid #eee;flex:0 0 auto}
.xp .navchips button{border:1px solid #ccc;background:#fafafa;border-radius:14px;padding:4px 10px;font-size:12px;white-space:nowrap;cursor:pointer}
.xp .navchips button.on{background:#e5f0fb;border-color:#0067c0}
.xp .msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;border:1px solid #bbb;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:14px;border-radius:8px;max-width:90%;z-index:5;font-size:13px}
@media(max-width:640px){.xp .navp{display:none}.xp .navchips{display:flex}.xp .row .ty,.xp .row .dt,.xp .hdr .ty,.xp .hdr .dt{display:none}.xp .search{width:90px}}
.appdoc{padding:20px;background:#e9e9e9;height:100%}
.appdoc .pg{background:#fff;max-width:520px;margin:0 auto;height:100%;min-height:200px;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:24px;font-family:'Times New Roman',serif;color:#444}

      let last=0;
      r.onclick=e=>{
        if(e.target.type==='checkbox'){w.sel=e.target.checked?[...w.sel,key]:w.sel.filter(k=>k!==key);drawWins();return}
        const t=Date.now();
        if(t-last<450&&w.sel.length===1&&w.sel[0]===key){openItem(node,path);return}
        last=t;
        if(e.ctrlKey||e.metaKey)w.sel=w.sel.includes(key)?w.sel.filter(k=>k!==key):[...w.sel,key];else w.sel=[key];
        // запазваме времето през прерисуването
        const keep=last;drawWins();const nr=$$('.wwin .row',desk).find(x=>x.querySelector('.nm')&&x.querySelector('.nm').textContent===node.n);if(nr)nr._last=keep;
      };
      if(r._last)last=r._last;
      Object.defineProperty(r,'_last',{set(v){last=v},get(){return last}});
      r.addEventListener('dragstart',e=>{if(!w.sel.includes(key))w.sel=[key];e.dataTransfer.setData('text/plain','x');st.drag={w,keys:[...w.sel]}});
      if(node.t==='dir'&&!w.q)dropTarget(r,[...path,node.n]);
      list.appendChild(r);
    });
    function dropTarget(elm,target){
      elm.addEventListener('dragover',e=>{if(st.drag){e.preventDefault();elm.classList.add('drop')}});
      elm.addEventListener('dragleave',()=>elm.classList.remove('drop'));
      elm.addEventListener('drop',e=>{e.preventDefault();elm.classList.remove('drop');if(!st.drag)return;
        const nodes=st.drag.keys.map(k=>k.split('/'));transfer(nodes,target,e.ctrlKey?'copy':'move');st.drag=null;st.drag=null;drawWins()});
    }
    const selNodes=()=>w.sel.map(k=>{const p=k.split('/');return {path:p.slice(0,-1),name:p[p.length-1],node:find(p)}}).filter(x=>x.node);
    // команди
    const C=[];
    if(inBin)C.push(['restore','Възстанови',WICON.restore,()=>{selNodes().forEach(s=>{const bin=find(['Кошче']);bin.c=bin.c.filter(x=>x!==s.node);const dest=find(s.node.from||['Документи'])||find(['Документи']);delete s.node.from;dest.c.push(s.node);st.flags.restored=st.flags.restored||[];st.flags.restored.push(s.node.n)});w.sel=[];drawWins();toast('Елементът е възстановен на старото си място.')},()=>w.sel.length]);
    else C.push(['new','Нов',WICON.newf,b=>{const p=popup(b,X,`<div class="grid"><button data-k="dir">Папка</button><button data-k="docx">Документ на Microsoft Word</button><button data-k="xlsx">Работен лист на Microsoft Excel</button></div>`);
      $$('button',p).forEach(x=>x.onclick=()=>{p.remove();const k=x.dataset.k;let base=k==='dir'?'Нова папка':k==='docx'?'Нов документ на Microsoft Word.docx':'Нов работен лист на Microsoft Excel.xlsx';let nm=base,i=2;while(here.c.some(c=>c.n===nm))nm=k==='dir'?`${base} (${i++})`:base.replace(/(\.\w+)$/,` (${i++})$1`);
        here.c.push(k==='dir'?{n:nm,t:'dir',c:[]}:{n:nm,t:k});w.sel=[[...w.path,nm].join('/')];w.renaming=nm;drawWins()})},()=>!w.q]);
    C.push(['open','Отвори',WICON.open,()=>{const s=selNodes()[0];if(s)openItem(s.node,s.path)},()=>w.sel.length===1&&!inBin]);
    C.push(['cut','Изрежи',WICON.cut,()=>{clip={mode:'move',items:w.sel.map(k=>k.split('/'))};toast('Изрязано. Отидете в друга папка и натиснете „Постави“.')},()=>w.sel.length&&!inBin]);
    C.push(['copy','Копирай',WICON.copy,()=>{clip={mode:'copy',items:w.sel.map(k=>k.split('/'))};toast('Копирано. Отидете в друга папка и натиснете „Постави“.')},()=>w.sel.length&&!inBin]);
    C.push(['paste','Постави',WICON.paste,()=>{transfer(clip.items,w.path,clip.mode);if(clip.mode==='move')clip=null;drawWins()},()=>clip&&!inBin&&!w.q]);
    C.push(['ren','Преименувай',WICON.ren,()=>{w.renaming=selNodes()[0].name;drawWins()},()=>w.sel.length===1&&!inBin&&!w.q]);
    C.push(['del','Изтрий',WICON.del,()=>{
      if(inBin){const bin=find(['Кошче']);selNodes().forEach(s=>bin.c=bin.c.filter(x=>x!==s.node));toast('Изтрито завинаги.')}
      else selNodes().forEach(s=>{const par=find(s.path);par.c=par.c.filter(x=>x!==s.node);s.node.from=s.path;find(['Кошче']).c.push(s.node);st.flags.deleted=st.flags.deleted||[];st.flags.deleted.push(s.node.n)});
      w.sel=[];drawWins()},()=>w.sel.length]);
    C.push(['zip','Компресирай в ZIP',WICON.zip,()=>{const s=selNodes();const par=find(s[0].path);const nm=s[0].name.replace(/\.\w+$/,'')+'.zip';
      if(par.c.some(c=>c.n===nm)){toast('Вече има файл „'+nm+'“.');return}
      par.c.push({n:nm,t:'zip',c:JSON.parse(JSON.stringify(s.map(x=>x.node)))});w.sel=[[...s[0].path,nm].join('/')];w.renaming=null;st.flags.zipped=nm;drawWins();toast('Създаден е архивът „'+nm+'“.')},()=>w.sel.length&&!inBin&&!w.q]);
    C.forEach(([id,label,ic,fn,en])=>{const b=el(`<button data-c="${id}">${ic}<span>${label}</span></button>`);b.disabled=!en();b.onclick=()=>fn(b);cmd.appendChild(b)});
    // преименуване на място
    if(w.renaming){
      const row=$$('.row',list).find(r=>$('.nm',r).textContent===w.renaming);
      if(row){const old=w.renaming;const inp=el(`<input class="ren">`);inp.value=old;$('.nm',row).replaceWith(inp);
        setTimeout(()=>{inp.focus();const dot=old.lastIndexOf('.');const nd=find([...w.path,old]);inp.setSelectionRange(0,nd&&nd.t!=='dir'&&dot>0?dot:old.length)},0);
        let doneR=false;
        const commit=()=>{if(doneR)return;doneR=true;let v=inp.value.trim();w.renaming=null;
          if(!v||v===old){drawWins();return}
          if(BAD.test(v)){showMsg('Името на файл не може да съдържа следните знаци:<br><b style="font-size:16px">\\ / : * ? " &lt; &gt; |</b>');return}
          if(here.c.some(c=>c.n.toLowerCase()===v.toLowerCase())){showMsg('В тази папка вече има елемент с име „'+esc(v)+'“.');return}
          const nd=find([...w.path,old]);const oe=old.includes('.')&&nd.t!=='dir'?old.split('.').pop():null;
          if(oe&&!v.toLowerCase().endsWith('.'+oe.toLowerCase())){v=v+'.'+oe;toast('Разширението .'+oe+' е запазено, за да може файлът да се отваря.')}
          nd.n=v;w.sel=[[...w.path,v].join('/')];st.flags.renamed=true;drawWins()};
        inp.onkeydown=e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){doneR=true;w.renaming=null;drawWins()}};
        inp.onblur=commit;inp.onclick=e=>e.stopPropagation();
      }
    }
    function showMsg(h){const m=el(`<div class="msg">${h}<div style="text-align:right;margin-top:10px"><button class="btn primary" style="padding:6px 14px">OK</button></div></div>`);X.appendChild(m);$('button',m).onclick=()=>{m.remove();w.renaming=null;drawWins()}}
    $('.status',X).textContent=`${items.length} елемента${w.sel.length?` | избрани: ${w.sel.length}`:''}`;
    srch.oninput=()=>{w.q=srch.value;w.sel=[];const pos=srch.selectionStart;drawWins();const ns=$$('.wwin .search',desk).pop();if(ns){ns.focus();ns.setSelectionRange(pos,pos)}};
    function openItem(node,path){
      if(node.t==='dir'){nav([...path,node.n]);return}
      st.opened.push([...path,node.n].join('/'));toast('Отворен е файлът „'+node.n+'“.');
    }
  }
  function transfer(paths,target,mode){
    const dest=find(target);let n=0;
    paths.forEach(p=>{
      const node=find(p);if(!node)return;const from=p.slice(0,-1);
      if(from.join('/')===target.join('/')&&mode==='move')return;
      if([...target].join('/').startsWith(p.join('/'))){toast('Не може папка да се премести в самата себе си.');return}
      let copy=mode==='copy'?JSON.parse(JSON.stringify(node)):node;
      let nm=copy.n;if(dest.c.some(c=>c.n===nm)){if(mode==='move'){toast('В целевата папка вече има „'+nm+'“.');return}nm=nm.replace(/(\.\w+)?$/,' – Копие$1');copy.n=nm}
      if(mode==='move'){const par=find(from);par.c=par.c.filter(x=>x!==node)}
      dest.c.push(copy);n++;
    });
    if(n)toast((mode==='move'?'Преместени':'Копирани')+' елементи: '+n);
    st.wins.forEach(w=>w.sel=[]);
  }
  (cfg.open||[]).forEach(o=>launch(o.app,o.path));
  if(!(cfg.open||[]).length)drawWins();
  return st;
}
const has=(st,path)=>!!st.find(path);

addModule({id:'win',name:'Windows и File Explorer',sub:'Работен плот, прозорци, файлове и папки',letter:'⊞',color:'#0067c0',
 intro:'Основи на Windows: меню „Старт“, прозорци, папки, файлове, архиви и облак.',
 phoneNote:['Windows и File Explorer са програми за компютър. На телефона упражнявайте в симулатора отдясно/долу – той изглежда като на компютър.','На телефон с Android подобна програма е „Файлове“ (Files), а на iPhone – „Файлове“.'],
 lessons:[
 {id:'win1',title:'Работен плот и меню „Старт“',plan:'Б2 1.1 – Елементи на работното пространство в Windows',
  theory:`<ul><li><b>Работен плот</b> – основният екран с икони (Кошче, Този компютър).</li><li><b>Лента на задачите</b> – долу; там са бутонът „Старт“, закачените програми и часовникът.</li><li><b>Меню „Старт“</b> – от него се стартират програмите. Може и да търсите програма, като пишете името ѝ.</li><li>Клавишът <kbd>⊞ Win</kbd> също отваря менюто „Старт“.</li></ul>`,
  goal:`<p>Отворете менюто <b>„Старт“</b> и стартирайте <b>Word</b>, а след това <b>Excel</b>.</p>`,
  pc:['Натиснете бутона <b>Старт</b> (четирите квадратчета) в лентата на задачите или клавиша <kbd>⊞ Win</kbd>.','Щракнете върху <b>Word</b> в „Закачени“.','Отворете пак „Старт“, напишете <b>excel</b> в полето за търсене и щракнете върху резултата.'],
  sim:h=>winSim(h,{}),
  check:s=>{const e=[];if(!s.startOpened)e.push('Не сте отворили менюто „Старт“.');if(!s.launched.word)e.push('Word още не е стартиран.');if(!s.launched.excel)e.push('Excel още не е стартиран.');return e}},
 {id:'win2',title:'Работа с прозорци',plan:'Б2 1.1 – Работен прозорец',
  theory:`<ul><li>Всяка програма се отваря в <b>прозорец</b>. Горе е заглавната лента с името.</li><li><b>—</b> Минимизиране – прозорецът се скрива в лентата на задачите.</li><li><b>☐</b> Максимизиране – прозорецът заема целия екран. <b>❐</b> го връща в нормален размер.</li><li><b>✕</b> Затваряне – програмата се затваря.</li><li>Скрит прозорец се връща, като щракнете иконата му в лентата на задачите.</li></ul>`,
  goal:`<p>С отворения прозорец на Word направете по ред:</p><ul><li>минимизирайте го;</li><li>върнете го от лентата на задачите;</li><li>максимизирайте го;</li><li>затворете го.</li></ul>`,
  pc:['Натиснете <b>—</b> горе вдясно на прозореца.','Щракнете иконата на Word в лентата на задачите.','Натиснете <b>☐</b> (или щракнете два пъти върху заглавната лента).','Натиснете <b>✕</b>.'],
  sim:h=>winSim(h,{open:[{app:'word'}]}),
  check:s=>{const f=s.flags,e=[];if(!f.minimized)e.push('Прозорецът не е минимизиран.');if(!f.restored)e.push('Прозорецът не е върнат от лентата на задачите.');if(!f.maximized)e.push('Прозорецът не е максимизиран.');if(!(f.closed&&f.closed.word))e.push('Word още не е затворен.');return e}},
 {id:'win3',title:'File Explorer и файловата система',plan:'Б2 1.1 – Файлова система, Windows Explorer',
  theory:`<ul><li><b>File Explorer</b> (Проводник) показва папките и файловете на компютъра.</li><li><b>Папка</b> е като папка в шкаф – в нея има файлове и други папки.</li><li><b>Пътят</b> показва къде сте, напр. <i>Документи › Курс › Графици</i>.</li><li>Типът на файла личи по <b>разширението</b>: .docx – Word, .xlsx – Excel, .pptx – PowerPoint, .pdf – PDF.</li><li>Двойно щракване отваря папка или файл. Стрелката <b>↑</b> връща една папка нагоре.</li></ul>`,
  goal:`<p>Намерете и отворете файла <b>График на курса.xlsx</b>. Той е в <i>Документи › Курс АОД › Графици</i>.</p>`,
  pc:['Отворете File Explorer от лентата на задачите (жълтата папка).','Вляво щракнете <b>Документи</b>.','Щракнете два пъти върху <b>Курс АОД</b>, после върху <b>Графици</b>.','Щракнете два пъти върху <b>График на курса.xlsx</b>.'],
  sim:h=>winSim(h,{fs:{'Документи':{'Курс АОД':{'Графици':{'График на курса.xlsx':0,'Почивни дни.docx':0},'Учебен план.pdf':0},'Лични':{'Снимка.jpg':0}}}}),
  check:s=>s.opened.includes('Документи/Курс АОД/Графици/График на курса.xlsx')?[]:['Файлът „График на курса.xlsx“ още не е отворен. Отворете го с двойно щракване или с бутона „Отвори“.']},
 {id:'win4',title:'Създаване на папки',plan:'А3 1.3.2 – Създаване на папки',
  theory:`<ul><li>Подредените папки пестят време – всеки документ има своето място.</li><li>Нова папка: <b>Нов → Папка</b> или <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>.</li><li>Веднага напишете името и натиснете <kbd>Enter</kbd>.</li><li>Добре е имената да са ясни: <i>„Заявления 2026“</i>, а не <i>„Нова папка (3)“</i>.</li></ul>`,

  pc:['В File Explorer отворете <b>Документи</b>.','Натиснете <b>Нов → Папка</b>.','Напишете <b>Курс АОД 2026</b> и натиснете <kbd>Enter</kbd>.','Отворете новата папка и по същия начин създайте <b>Заявления</b>.'],

 {id:'win5',title:'Именуване и преименуване на файлове',plan:'А3 1.3.2 – Именуване на файлове',
  theory:`<ul><li>Името трябва да казва какво има във файла: <i>Заявление_Мария_Петрова.docx</i>.</li><li>Не можете да използвате знаците <b>\\ / : * ? " &lt; &gt; |</b>.</li><li>Не сменяйте <b>разширението</b> (.docx, .xlsx) – иначе файлът може да не се отваря.</li><li>Преименуване: изберете файла и натиснете <b>Преименувай</b> или <kbd>F2</kbd>.</li></ul>`,

  pc:['Щракнете веднъж върху файла, за да го изберете.','Натиснете <b>Преименувай</b> или <kbd>F2</kbd>.','Напишете новото име (разширението остава) и натиснете <kbd>Enter</kbd>.'],
  sim:h=>winSim(h,{fs:{'Документи':{'Документ1.docx':0,'Книга1.xlsx':0,'Протокол.docx':0}},open:[{app:'explorer',path:['Документи']}]}),
  check:s=>{const e=[];if(!has(s,['Документи','Заявление_Мария_Петрова.docx']))e.push('Няма файл „Заявление_Мария_Петрова.docx“.');if(!has(s,['Документи','Присъствие_ноември.xlsx']))e.push('Няма файл „Присъствие_ноември.xlsx“.');return e}},
 {id:'win6',title:'Копиране и преместване',plan:'А3 1.3.2 – Организиране на информация',
  theory:`<ul><li><b>Преместване</b> (Изрежи → Постави): файлът отива на новото място и изчезва от старото.</li><li><b>Копиране</b> (Копирай → Постави): получавате два еднакви файла.</li><li>Клавиши: <kbd>Ctrl</kbd>+<kbd>X</kbd> изрязване, <kbd>Ctrl</kbd>+<kbd>C</kbd> копиране, <kbd>Ctrl</kbd>+<kbd>V</kbd> поставяне.</li><li>Няколко файла избирате с <kbd>Ctrl</kbd>+щракване или с отметките.</li><li>Може и да ги провлачите с мишката върху папката.</li></ul>`,
  goal:`<p>Преместете трите файла <b>Заявление_1.docx</b>, <b>Заявление_2.docx</b> и <b>Заявление_3.docx</b> от <b>Изтегляния</b> в <b>Документи › Заявления</b>. Файлът <b>Инструкция.pdf</b> копирайте там (да остане и в Изтегляния).</p>`,
  pc:['Отворете <b>Изтегляния</b>. Изберете трите заявления с отметките или с <kbd>Ctrl</kbd>+щракване.','Натиснете <b>Изрежи</b>.','Отворете <b>Документи › Заявления</b> и натиснете <b>Постави</b>.','Върнете се в Изтегляния, изберете <b>Инструкция.pdf</b> → <b>Копирай</b> → в Заявления → <b>Постави</b>.'],
  sim:h=>winSim(h,{fs:{'Изтегляния':{'Заявление_1.docx':0,'Заявление_2.docx':0,'Заявление_3.docx':0,'Инструкция.pdf':0,'снимка_телефон.jpg':0},'Документи':{'Заявления':{}}},open:[{app:'explorer',path:['Изтегляния']}]}),
  check:s=>{const e=[];[1,2,3].forEach(i=>{const n='Заявление_'+i+'.docx';if(!has(s,['Документи','Заявления',n]))e.push(`„${n}“ не е в Документи › Заявления.`);else if(has(s,['Изтегляния',n]))e.push(`„${n}“ още е и в Изтегляния – трябва да се премести, не да се копира.`)});
    if(!has(s,['Документи','Заявления','Инструкция.pdf']))e.push('„Инструкция.pdf“ не е копиран в Заявления.');else if(!has(s,['Изтегляния','Инструкция.pdf']))e.push('„Инструкция.pdf“ трябваше да остане и в Изтегляния (копиране, не преместване).');return e}},
 {id:'win7',title:'Изтриване и Кошче',plan:'А3 1.3.2 – Организиране на информация',
  theory:`<ul><li>Изтритите файлове отиват в <b>Кошчето</b>. Оттам могат да се <b>възстановят</b>.</li><li>Ако изтриете файл от Кошчето, той се губи завинаги.</li><li>Клавиш за изтриване: <kbd>Delete</kbd>.</li></ul>`,
  goal:`<p>В <b>Документи</b> изтрийте <b>стар_списък.docx</b>. След това отворете <b>Кошчето</b> и възстановете <b>Важен_договор.pdf</b>, който е изтрит по погрешка.</p>`,

 {id:'win8',title:'Архивиране (ZIP) и съхранение в облак',plan:'А3 1.3.2 – Архивиране, съхранение в облак',

 {id:'win9',title:'Търсене на файлове',plan:'Б2 1.1, А3 1.3.2 – Търсене на информация',

 ]});

document.head.appendChild(Object.assign(document.createElement('style'),{textContent:`

.wf{background:#e7eefb;border-radius:3px;padding:0 2px;color:#1e4b8f;white-space:nowrap}

.wmerged{max-width:640px;margin:12px auto 0;display:grid;gap:10px}

.wmerged h6{margin:0 0 6px;font:600 12px Inter,sans-serif;color:#2b579a}
.wrec{max-width:640px;margin:0 auto 10px;background:#fff;border:1px solid #ccc;border-radius:6px;font-size:13px;overflow:auto}
.wrec table{border-collapse:collapse;width:100%}.wrec td,.wrec th{border:1px solid #ddd;padding:4px 6px;text-align:left}
.wrec th{background:#f1f5fb}
.wstat{font-size:12px;color:#555;background:#f3f3f3;border-top:1px solid #ddd;padding:3px 10px}
@media(max-width:600px){.wpw{padding:8px}.wed{padding:18px 14px;font-size:15px}.whf{padding:6px 14px}}
.env{max-width:560px;margin:0 auto;aspect-ratio:22/11;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.2);position:relative;font:14px/1.4 "Times New Roman",serif}

.envform label{font-size:13px;font-weight:600}
.envform textarea{font:14px Inter,sans-serif;width:100%;padding:6px;border:1px solid #bbb;border-radius:6px}
`}));

/* Общ симулатор на Word.
   cfg: {doc, tools:[...], page:'card', hf:true, fields:[], records:[], fname} */
function wordSim(host,cfg){
  const T=new Set(cfg.tools||['b','i','u','align','undo']);
  const app=el('<div class="app"></div>');host.appendChild(app);
  const st={cols:1,merged:false,preview:false,rec:0,replaced:0,cfg};
  let saved=null,lastEd=null;
  const pw=el(`<div class="wpw">${cfg.records?'<div class="wrec"></div>':''}<div class="wpage ${cfg.page==='card'?'card':''}">
     <div class="whf hdr ${cfg.hf?'show':''}" ${cfg.hf?'contenteditable="true"':''} data-ph="Горен колонтитул – щракнете тук"></div>
     <div class="wed" contenteditable="true" spellcheck="false"></div>
     <div class="whf ftr ${cfg.hf?'show':''}" ${cfg.hf?'contenteditable="true"':''} data-ph="Долен колонтитул – щракнете тук"></div></div><div class="wmerged"></div></div>`);
  const ed=$('.wed',pw),hdr=$('.hdr',pw),ftr=$('.ftr',pw);
  ed.innerHTML=cfg.doc;
  st.ed=ed;st.hdr=hdr;st.ftr=ftr;st.page=$('.wpage',pw);
  const edits=[ed,hdr,ftr];
  document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount)return;const t=edits.find(x=>x.contains(s.anchorNode));if(t){saved=s.getRangeAt(0).cloneRange();lastEd=t;rb&&rb.refresh()}});
  function restore(){const t=lastEd||ed;t.focus();if(saved&&t.contains(saved.startContainer)){const s=getSelection();s.removeAllRanges();s.addRange(saved)}return t}
  function exec(c,v){restore();document.execCommand(c,false,v==null?null:v)}
  function insertHTML(h){const t=restore();if(!saved||!t.contains(saved.startContainer)){const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}document.execCommand('insertHTML',false,h)}
  try{document.execCommand('defaultParagraphSeparator',false,'div')}catch(e){}
  const q=c=>{try{return document.queryCommandState(c)}catch(e){return false}};
  const tool=(id,html,title,run,active,extra)=>Object.assign({id,html,title,run,active},extra||{});
  const home=[],ins=[],lay=[],mail=[];
  if(T.has('b'))home.push(tool('b','<span class="t">B</span>','Удебелен (Ctrl+B)',()=>exec('bold'),()=>q('bold')),tool('i','<span class="t" style="font-style:italic">I</span>','Курсив (Ctrl+I)',()=>exec('italic'),()=>q('italic')),tool('u','<span class="t" style="text-decoration:underline">U</span>','Подчертан (Ctrl+U)',()=>exec('underline'),()=>q('underline')));
  if(T.has('size'))home.push(tool('size','<span style="font-weight:600">Размер</span> ▾','Размер на шрифта',b=>{
    const p=popup(b,app,`<h5>Размер на шрифта</h5><div class="grid" style="grid-template-columns:repeat(5,1fr)">${[8,10,11,12,14,16,18,20,24,28].map(s=>`<button data-s="${s}">${s}</button>`).join('')}</div>`);
    $$('button',p).forEach(x=>x.onclick=()=>{p.remove();setSize(+x.dataset.s)})}));
  if(home.length)home.push('|');
  if(T.has('align'))home.push(tool('left',WI.left,'Подравняване вляво (Ctrl+L)',()=>exec('justifyLeft')),tool('center',WI.center,'Центриране (Ctrl+E)',()=>exec('justifyCenter')),tool('right',WI.right,'Подравняване вдясно (Ctrl+R)',()=>exec('justifyRight')),tool('justify',WI.justify,'Двустранно подравняване (Ctrl+J)',()=>exec('justifyFull')),'|');
  if(T.has('lists'))home.push(tool('ul',WI.ul,'Водещи символи',()=>exec('insertUnorderedList'),()=>q('insertUnorderedList')),tool('ol',WI.ol,'Номериране',()=>exec('insertOrderedList'),()=>q('insertOrderedList')),'|');
  if(T.has('find'))home.push(tool('find',WI.find+' Замести','Търсене и заместване (Ctrl+H)',b=>findDlg(b)),'|');
  home.push(tool('undo',WI.undo,'Отмяна (Ctrl+Z)',()=>exec('undo')),tool('redo',WI.redo,'Връщане (Ctrl+Y)',()=>exec('redo')));
  if(T.has('table'))ins.push(tool('table',WI.table+' Таблица','Вмъкване на таблица',b=>tableDlg(b)));
  if(T.has('pic'))ins.push(tool('pic',WI.pic+' Картини','Вмъкване на картина',b=>{
    const p=popup(b,app,`<h5>Вмъкване на картина</h5><div class="grid" style="grid-template-columns:repeat(3,1fr)">${Object.keys(WPICS).map(k=>`<button data-k="${k}"><img src="${WPICS[k]}" style="height:36px;display:block;margin:0 auto 4px">${k}</button>`).join('')}</div>`);
    $$('button',p).forEach(x=>x.onclick=()=>{p.remove();insertHTML(`<img src="${WPICS[x.dataset.k]}" alt="${x.dataset.k}">`)})}));
  if(T.has('textbox'))ins.push(tool('textbox',WI.textbox+' Текстово поле','Вмъкване на текстово поле',()=>insertHTML('<div style="border:1.5px solid #2b579a;padding:6px 10px;margin:6px 0;display:inline-block;min-width:160px">Текст в поле</div><div><br></div>')));
  if(T.has('symbol'))ins.push(tool('symbol','<span style="font:700 17px Georgia">Ω</span> Символ','Вмъкване на символ',b=>{
    const p=popup(b,app,`<h5>Символ</h5><div class="grid" style="grid-template-columns:repeat(6,1fr)">${['№','©','®','™','€','§','„','“','–','—','•','°','½','±','×','→'].map(s=>`<button data-s="${s}" style="font-size:18px">${s}</button>`).join('')}</div>`);
    $$('button',p).forEach(x=>x.onclick=()=>{p.remove();restore();document.execCommand('insertText',false,x.dataset.s)})}));
  if(T.has('hf'))ins.push('|',tool('hdr',WI.hdr+' Горен колонтитул','Горен колонтитул',()=>{hdr.focus();lastEd=hdr}),tool('ftr',WI.ftr+' Долен колонтитул','Долен колонтитул',()=>{ftr.focus();lastEd=ftr}),tool('pnum','<b>#</b> Номер на страница','Номер на страница (в долния колонтитул)',()=>{ftr.focus();lastEd=ftr;const r=document.createRange();r.selectNodeContents(ftr);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('insertHTML',false,'<span class="pnum">1</span>');st.pnum=true}));
  if(T.has('cols'))lay.push(tool('cols',WI.cols+' Колони ▾','Колони',b=>{
    const p=popup(b,app,`<h5>Колони</h5><div class="grid">${[['1','Една'],['2','Две'],['3','Три']].map(([n,t])=>`<button data-n="${n}">${t}</button>`).join('')}</div>`);
    $$('button',p).forEach(x=>x.onclick=()=>{p.remove();st.cols=+x.dataset.n;ed.style.columnCount=st.cols>1?st.cols:'';ed.style.columnGap='28px'})}));
  if(T.has('merge')){
    mail.push(tool('field','Вмъкни поле ▾','Вмъкване на поле за сливане',b=>{
      const p=popup(b,app,`<h5>Поле за сливане</h5><div class="grid">${cfg.fields.map(f=>`<button data-f="${f}">${f}</button>`).join('')}</div>`);
      $$('button',p).forEach(x=>x.onclick=()=>{p.remove();insertHTML(`<span class="wf" contenteditable="false" data-f="${x.dataset.f}">«${x.dataset.f}»</span>&nbsp;`)})}),
    tool('prev','Преглед на резултатите','Преглед на резултатите',()=>{st.preview=!st.preview;showFields()},()=>st.preview),
    tool('pr','◀','Предишен запис',()=>{st.rec=Math.max(0,st.rec-1);showFields()}),tool('nx','▶','Следващ запис',()=>{st.rec=Math.min(cfg.records.length-1,st.rec+1);showFields()}),'|',
    tool('fin','Завърши и слей','Завършване и сливане – отделен документ за всеки запис',()=>finish()));
    const rec=$('.wrec',pw);
    rec.innerHTML=`<div style="padding:4px 8px;font-weight:600">Списък с получатели (източник на данни)</div><table><tr>${cfg.fields.map(f=>`<th>${f}</th>`).join('')}</tr>${cfg.records.map(r=>`<tr>${cfg.fields.map(f=>`<td>${esc(r[f])}</td>`).join('')}</tr>`).join('')}</table>`;
  }
  const tabs=[{name:'Файл',tools:[]},{name:'Начало',tools:home},{name:'Вмъкване',tools:ins},{name:'Оформление',tools:lay}];
  if(T.has('merge'))tabs.push({name:'Пощенски списъци',tools:mail});
  tabs.push({name:'Преглед',tools:[]});
  const rb=ribbon(app,'#2b579a',tabs,cfg.fname||'Документ1.docx',1);
  app.appendChild(pw);
  app.appendChild(el('<div class="wstat">Страница 1 от 1 · Български</div>'));
  function setSize(pt){
    restore();document.execCommand('fontSize',false,'7');
    $$('font[size="7"]',lastEd||ed).forEach(f=>{const s=document.createElement('span');s.style.fontSize=pt+'pt';s.innerHTML=f.innerHTML;f.replaceWith(s)});
  }
  function findDlg(b){
    const p=popup(b,app,`<button class="x">×</button><h5>Търсене и заместване</h5><label>Търси:</label><input id="ff"><label>Замести с:</label><input id="fr"><div class="row"><button id="fn">Намери следващия</button><button id="fa">Замести всички</button></div><div id="fm" style="margin-top:8px;color:#2b579a"></div>`);
    $('#ff',p).focus();
    $('#fn',p).onclick=()=>{const f=$('#ff',p).value;if(!f)return;const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const i=n.nodeValue.indexOf(f);if(i>=0){const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+f.length);const s=getSelection();s.removeAllRanges();s.addRange(r);$('#fm',p).textContent='Намерено.';return}}$('#fm',p).textContent='Не е намерено.'};
    $('#fa',p).onclick=()=>{const f=$('#ff',p).value,r=$('#fr',p).value;if(!f)return;let c=0;const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);const ns=[];let n;while(n=w.nextNode())ns.push(n);ns.forEach(n=>{const parts=n.nodeValue.split(f);if(parts.length>1){c+=parts.length-1;n.nodeValue=parts.join(r)}});st.replaced+=c;$('#fm',p).textContent=c?`Готово. Направени са ${c} замествания.`:'Не е намерено.'};
  }
  function tableDlg(b){
    const p=popup(b,app,`<button class="x">×</button><h5>Вмъкване на таблица</h5><label>Брой колони:</label><input id="tc" type="number" min="1" max="8" value="3"><label>Брой редове:</label><input id="tr" type="number" min="1" max="12" value="3"><div class="row"><button id="ti">Вмъкни</button></div>`);
    $('#ti',p).onclick=()=>{const c=Math.max(1,Math.min(8,+$('#tc',p).value||1)),r=Math.max(1,Math.min(12,+$('#tr',p).value||1));p.remove();
      insertHTML('<table>'+Array.from({length:r},()=>'<tr>'+'<td><br></td>'.repeat(c)+'</tr>').join('')+'</table><div><br></div>')};
  }
  function showFields(){$$('.wf',ed).forEach(f=>{const k=f.dataset.f;f.textContent=st.preview?cfg.records[st.rec][k]:'«'+k+'»'});rb.refresh()}
  function finish(){
    const out=$('.wmerged',pw);const tpl=ed.cloneNode(true);
    if(!$$('.wf',ed).length){toast('Първо вмъкнете полета от „Вмъкни поле“.');return}
    out.innerHTML=cfg.records.map((r,i)=>{const c=tpl.cloneNode(true);$$('.wf',c).forEach(f=>f.replaceWith(document.createTextNode(r[f.dataset.f])));return `<div class="m"><h6>Писмо ${i+1} от ${cfg.records.length}</h6>${c.innerHTML}</div>`}).join('');
    st.merged=true;toast(`Създадени са ${cfg.records.length} писма – вижте под документа.`);
  }
  ed.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const m={e:'justifyCenter',r:'justifyRight',l:'justifyLeft',j:'justifyFull'}[e.key.toLowerCase()];if(m){e.preventDefault();document.execCommand(m)}if(e.key.toLowerCase()==='h'&&T.has('find')){e.preventDefault();rb.select('Начало');findDlg($('[data-tool=find]',app))}});
  return st;
}
/* ----- помощни проверки ----- */
function wText(ed){return ed.innerText.replace(/ /g,' ')}
function wRange(ed,word){
  const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let nodes=[],full='',n;
  while(n=w.nextNode()){nodes.push([n,full.length]);full+=n.nodeValue}
  const s=full.indexOf(word);if(s<0)return null;const e=s+word.length;
  return nodes.filter(([node,pos])=>!(pos+node.nodeValue.length<=s||pos>=e)).map(x=>x[0].parentElement);
}
function wAll(ed,word,test){const r=wRange(ed,word);return !!r&&r.length>0&&r.every(test)}
const isBold=e=>parseInt(getComputedStyle(e).fontWeight,10)>=600;
const isItalic=e=>getComputedStyle(e).fontStyle==='italic';
const isUnder=e=>{for(let x=e;x&&!x.classList.contains('wed');x=x.parentElement){if(/underline/.test(getComputedStyle(x).textDecorationLine))return true}return false};
const alignOf=e=>{const a=getComputedStyle(e).textAlign;return a==='start'?'left':a==='end'?'right':a};
const ptOf=e=>parseFloat(getComputedStyle(e).fontSize)*0.75;
function W(errs,cond,msg){if(!cond)errs.push(msg)}

const XC='ABCDEFGHIJKL';
const xref=(r,c)=>XC[c-1]+r;
function xparse(ref){const m=/^\$?([A-L])\$?(\d+)$/i.exec(ref.trim());return m?{c:XC.indexOf(m[1].toUpperCase())+1,r:+m[2]}:null}
function xnum(v){if(typeof v==='number')return v;const s=String(v).trim();if(/^-?\d+([.,]\d+)?%$/.test(s))return parseFloat(s.replace(',','.'))/100;if(/^-?\d+([.,]\d+)?$/.test(s))return parseFloat(s.replace(',','.'));return null}
function xfmtNum(n,f){
  const fx=(v,d)=>v.toLocaleString('bg-BG',{minimumFractionDigits:d,maximumFractionDigits:d});
  if(f==='eur')return fx(n,2)+' €';if(f==='pct')return fx(n*100,Number.isInteger(Math.round(n*10000)/100)?0:2)+'%';if(f==='n2')return fx(n,2);
  return (Math.round(n*1e9)/1e9).toLocaleString('bg-BG',{maximumFractionDigits:9,useGrouping:false});
}
// Измества относителните адреси във формула (при копиране/попълване)
function xshift(f,dr,dc){return f.replace(/(\$?)([A-L])(\$?)(\d+)(?![\d(])/gi,(m,a,c,b,r,off)=>{if(/[A-Z]/i.test(f[off-1]||''))return m;const nc=a?c:XC[XC.indexOf(c.toUpperCase())+dc]||'#',nr=b?r:(+r+dr);return a+nc+b+(nr>0?nr:'#')})}

/* ---- формули ---- */
class XErr{constructor(e){this.e=e}}
function xeval(src,get){
  const toks=[];let s=src,m;
  while(s.length){
    if(m=/^\s+/.exec(s)){s=s.slice(m[0].length);continue}
    if(m=/^"([^"]*)"/.exec(s))toks.push({t:'s',v:m[1]});
    else if(m=/^\$?[A-L]\$?\d+(:\$?[A-L]\$?\d+)?(?![\w(])/i.exec(s))toks.push({t:'ref',v:m[0].toUpperCase()});
    else if(m=/^[A-Z]+(?=\s*\()/i.exec(s))toks.push({t:'fn',v:m[0].toUpperCase()});
    else if(m=/^\d+([.,]\d+)?/.exec(s))toks.push({t:'n',v:parseFloat(m[0].replace(',','.'))});
    else if(m=/^(<=|>=|<>|[-+*/^();,%&=<>:])/.exec(s))toks.push({t:'op',v:m[0]});
    else throw new XErr('#NAME?');
    s=s.slice(m[0].length);
  }
  let i=0;const pk=()=>toks[i],nx=()=>toks[i++];
  const isOp=v=>pk()&&pk().t==='op'&&pk().v===v;
  const N=v=>{if(v instanceof XErr)throw v;if(Array.isArray(v))v=v[0];if(v===''||v==null)return 0;if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;const n=xnum(v);if(n==null)throw new XErr('#VALUE!');return n};
  function cmp(){let a=add();while(pk()&&pk().t==='op'&&['=','<>','<','>','<=','>='].includes(pk().v)){const o=nx().v,b=add();const x=Array.isArray(a)?a[0]:a,y=Array.isArray(b)?b[0]:b;

    const g=region();if(g.r2-g.r1<1){toast('Щракнете в таблицата с данни.');return}
    const col=st.act.c;memo={};
    const rows=[];for(let r=g.r1+1;r<=g.r2;r++){const cs={};for(let c=g.c1;c<=g.c2;c++)cs[c]=cell(r,c)?{...cell(r,c)}:null;rows.push({r,cs,key:val(r,col)})}
    rows.sort((a,b)=>{const x=a.key,y=b.key;if(typeof x==='number'&&typeof y==='number')return (x-y)*dir;return String(x).localeCompare(String(y),'bg')*dir});
    rows.forEach((row,i)=>{const nr=g.r1+1+i;for(let c=g.c1;c<=g.c2;c++){const ce=row.cs[c];const k=xref(nr,c);if(!ce){delete st.cells[k];continue}if(ce.v&&ce.v.startsWith('='))ce.v=xshift(ce.v,nr-row.r,0);st.cells[k]=ce}});
    st.sorted={col,dir};draw();toast(`Сортирано по колона ${XC[col-1]} ${dir>0?'от А до Я':'от Я до А'}.`);
  }
  // ---- филтър ----
  function toggleFilter(){if(st.filter){st.filter=null;draw();return}const g=region();if(g.r2-g.r1<1){toast('Щракнете в таблицата с данни.');return}st.filter={...g,crit:{}};draw();toast('В заглавния ред се появиха бутони ▾.')}
  function filterDlg(b,c){
    const f=st.filter;memo={};const vals=[...new Set(Array.from({length:f.r2-f.r1},(_,i)=>String(val(f.r1+1+i,c))))].sort((a,b)=>a.localeCompare(b,'bg'));
    const cur=f.crit[c];
    const p=popup(b,app,`<button class="x">×</button><h5>Филтър: ${esc(String(val(f.r1,c)))}</h5><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="all" style="width:auto" ${!cur?'checked':''}> (Избери всички)</label><div style="max-height:200px;overflow:auto">${vals.map(v=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" value="${esc(v)}" ${!cur||cur.has(v)?'checked':''}> ${esc(v)}</label>`).join('')}</div><div class="row"><button id="fok">OK</button><button id="fcl">Изчисти филтъра</button></div>`);
    const boxes=$$('input[value]',p);$('#all',p).onchange=e=>boxes.forEach(x=>x.checked=e.target.checked);
    $('#fok',p).onclick=()=>{const s=new Set(boxes.filter(x=>x.checked).map(x=>x.value));if(s.size===vals.length)delete f.crit[c];else f.crit[c]=s;p.remove();draw()};
    $('#fcl',p).onclick=()=>{delete f.crit[c];p.remove();draw()};
  }
  // ---- диаграми ----
  function makeChart(type){
    let s=norm();if(s.r1===s.r2&&s.c1===s.c2)s=region();memo={};
    let lc=s.c1,vc=null;for(let c=s.c1;c<=s.c2;c++){if(typeof val(s.r1+1,c)==='number'){vc=c;break}}
    if(vc==null||vc===lc){toast('Маркирайте колона с имена и колона с числа (със заглавията).');return}
    const hasHdr=typeof val(s.r1,vc)!=='number';const start=hasHdr?s.r1+1:s.r1;
    const labels=[],values=[];for(let r=start;r<=s.r2;r++){if(hidden(r))continue;const v=val(r,vc);if(typeof v!=='number')continue;labels.push(String(val(r,lc)));values.push(v)}
    st.chart={type,labels,values,title:hasHdr?String(val(s.r1,vc)):'Диаграма'};drawOut();toast('Диаграмата е вмъкната под таблицата.');
    setTimeout(()=>{const ch=$('.xchart',out);if(ch)ch.scrollIntoView({behavior:'smooth',block:'nearest'})},50);
  }
  function chartSVG(ch){
    const W=480,H=240,P=36;const max=Math.max(...ch.values,0)||1;const n=ch.values.length;const cols=['#217346','#2b6a8a','#b5501f','#7b4fb8','#c49a1a','#c43e1c','#4b8bbe','#888'];
    if(ch.type==='pie'){let a=-Math.PI/2;const tot=ch.values.reduce((x,y)=>x+y,0)||1;let s='';ch.values.forEach((v,i)=>{const a2=a+v/tot*Math.PI*2;const x1=120+90*Math.cos(a),y1=120+90*Math.sin(a),x2=120+90*Math.cos(a2),y2=120+90*Math.sin(a2);s+=`<path d="M120 120L${x1} ${y1}A90 90 0 ${a2-a>Math.PI?1:0} 1 ${x2} ${y2}z" fill="${cols[i%8]}" stroke="#fff"/>`;a=a2});
      return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}${ch.labels.map((l,i)=>`<rect x="250" y="${20+i*22}" width="12" height="12" fill="${cols[i%8]}"/><text x="268" y="${30+i*22}" font-size="12">${esc(l)} – ${xfmtNum(ch.values[i])}</text>`).join('')}</svg>`}
    const bw=(W-P-10)/n;let s=`<line x1="${P}" y1="${H-P}" x2="${W-5}" y2="${H-P}" stroke="#999"/>`;
    for(let g=0;g<=4;g++){const y=H-P-(H-P-15)*g/4;s+=`<line x1="${P}" x2="${W-5}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${P-4}" y="${y+4}" font-size="10" text-anchor="end" fill="#666">${xfmtNum(Math.round(max*g/4))}</text>`}
    const pts=[];ch.values.forEach((v,i)=>{const h=(H-P-15)*v/max,x=P+i*bw;if(ch.type==='bar')s+=`<rect x="${x+bw*.18}" y="${H-P-h}" width="${bw*.64}" height="${h}" fill="#217346"/>`;pts.push([x+bw/2,H-P-h]);s+=`<text x="${x+bw/2}" y="${H-P+14}" font-size="11" text-anchor="middle">${esc(ch.labels[i].slice(0,10))}</text>`});
    if(ch.type==='line')s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#217346" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#217346"/>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
  }
  // ---- обобщена таблица ----
  function pivotDlg(b){
    const g=region();if(g.r2-g.r1<1){toast('Щракнете в таблицата с данни.');return}memo={};
    const hdr=[];for(let c=g.c1;c<=g.c2;c++)hdr.push({c,n:String(val(g.r1,c)),num:typeof val(g.r1+1,c)==='number'});
    const p=popup(b,app,`<button class="x">×</button><h5>Създаване на обобщена таблица</h5><div class="small">Данни: ${xref(g.r1,g.c1)}:${xref(g.r2,g.c2)}</div><label>Редове (по какво да групира):</label><select id="pr">${hdr.filter(h=>!h.num).map(h=>`<option value="${h.c}">${esc(h.n)}</option>`).join('')}</select><label>Стойности (какво да пресметне):</label><select id="pv">${hdr.filter(h=>h.num).map(h=>`<option value="${h.c}">${esc(h.n)}</option>`).join('')}</select><label>Функция:</label><select id="pf"><option value="sum">Сума</option><option value="count">Брой</option><option value="avg">Средно</option></select><div class="row"><button id="pok">OK</button></div>`);
    $('#pok',p).onclick=()=>{const rc=+$('#pr',p).value,vc=+$('#pv',p).value,fn=$('#pf',p).value;p.remove();const m=new Map();
      for(let r=g.r1+1;r<=g.r2;r++){const k=String(val(r,rc));const v=val(r,vc);if(!m.has(k))m.set(k,[]);if(typeof v==='number')m.get(k).push(v)}
      const agg=a=>fn==='sum'?a.reduce((x,y)=>x+y,0):fn==='count'?a.length:a.reduce((x,y)=>x+y,0)/(a.length||1);
      const rows=[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'bg')).map(([k,a])=>[k,agg(a)]);
      const all=[];m.forEach(a=>all.push(...a));
      st.pivot={row:String(val(g.r1,rc)),val:String(val(g.r1,vc)),fn,rows,total:agg(all)};st.pivotChart=false;drawOut();toast('Обобщената таблица е създадена под данните.')};
  }
  function drawOut(){
    let h='';
    if(st.chart)h+=`<div class="xchart"><h6>${esc(st.chart.title)}</h6>${chartSVG(st.chart)}</div>`;
    if(st.pivot){const P=st.pivot,fnN={sum:'Сума',count:'Брой',avg:'Средно'}[P.fn];
      h+=`<div class="xpiv"><b style="font-size:13px">Обобщена таблица</b><table><tr><th>${esc(P.row)}</th><th>${fnN} от ${esc(P.val)}</th></tr>${P.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${xfmtNum(r[1])}</td></tr>`).join('')}<tr class="tot"><td>Общ сбор</td><td class="n">${xfmtNum(P.total)}</td></tr></table>
      <div class="actions" style="margin-top:8px"><button class="btn ghost" id="pch" style="padding:6px 10px;font-size:13px">Обобщена диаграма</button></div>${st.pivotChart?`<div class="xchart" style="margin-top:8px;border:0"><h6>${fnN} от ${esc(P.val)} по ${esc(P.row)}</h6>${chartSVG({type:'bar',labels:P.rows.map(r=>r[0]),values:P.rows.map(r=>r[1])})}</div>`:''}</div>`}

    let t='<table>';for(let r=1;r<=R;r++){let row='',any=false;for(let c=1;c<=Math.max(used,1);c++){const v=val(r,c);if(v!=='')any=true;row+=`<td>${typeof v==='number'?xfmtNum(v,(cell(r,c)||{}).f):esc(v instanceof XErr?v.e:v)}</td>`}if(any)t+='<tr>'+row+'</tr>'}t+='</table>';
    const fits=land||used<=4;
    const ov=el(`<div class="xprev"><div class="xbar"><b>Предпечатен преглед</b> · ${land?'Албумна':'Книжна'} ориентация</div><div class="pp" style="width:${land?300:212}px;height:${land?212:300}px">${t}${fits?'':'<div style="color:#c00;font-size:9px;margin-top:6px">Последните колони не се побират и ще излязат на отделна страница.</div>'}</div><div class="xbar"><span>Страници: ${fits?1:2}</span><button class="btn primary" style="padding:6px 14px">Затвори</button></div></div>`);
    app.appendChild(ov);$('button',ov).onclick=()=>ov.remove();
  }
  draw();
  return st;
}

 {id:'excel5',title:'Относителни и абсолютни адреси',plan:'Б2 2.10 – Видове адреси на клетки',

  const show=[{id:'start',html:'▶ От началото',title:'Прожекция от началото (F5)',run:()=>slideShow(0)},{id:'startc',html:'▷ От текущия слайд',title:'От текущия слайд (Shift+F5)',run:()=>slideShow(st.cur)}];
  const rb=ribbon(app,'#c43e1c',[{name:'Файл',tools:[]},{name:'Начало',tools:home},{name:'Вмъкване',tools:ins},{name:'Дизайн',tools:design},{name:'Преходи',tools:trans},{name:'Анимации',tools:anim},{name:'Прожекция',tools:show}],cfg.fname||'Презентация1.pptx',1);
  const pw=el('<div class="pw"><div class="pthumbs"></div><div class="pmain"><div class="stage"></div><div class="pnotes" contenteditable="true"></div><div class="small" style="margin-top:4px" id="pinfo"></div></div></div>');

  function selShape(){return S().shapes.find(x=>x.id===st.sel)}
  function addShape(o){const id='s'+Math.random().toString(36).slice(2,7);S().shapes.push(Object.assign({id,x:60-(S().shapes.length%3)*22,y:55-(S().shapes.length%2)*12,w:o.type==='star'?14:22,h:o.type==='star'?25:20,fill:'#4472c4'},o));st.sel=id;draw();toast('Обектът е вмъкнат. Може да го преместите с плъзгане.')}
  function slideHTML(s,ed){
    const t=PTHEMES[st.theme];const bg=st.bg||t.bg;
    const ce=(cls,f,ph)=>`<div class="${cls} ${ed&&st.sel===f?'sel':''}" data-f="${f}" ${ed?`contenteditable="true" data-ph="${ph}"`:''}>${s[f]}</div>`;
    let h=`<div class="sl L-${s.layout} ${ed?'ed':''}" style="background:${bg};color:${t.fg};font-family:${t.font}">`;

    if(s.layout==='content')h+=ce('bo','body','Щракнете, за да добавите текст');

      h+=`<div class="sh ${ed&&st.sel===x.id?'sel':''}" data-id="${x.id}" style="left:${x.x}%;top:${x.y}%;width:${x.w}%;height:${x.h}%">${inner}</div>`});

  }
  function draw(){
    thumbs.innerHTML='';
    st.slides.forEach((s,i)=>{const b=el(`<button class="th ${i===st.cur?'on':''}"><span>${i+1}${s.trans!=='none'?'<br>★':''}</span>${slideHTML(s,false)}</button>`);b.onclick=()=>{st.cur=i;st.sel=null;draw()};thumbs.appendChild(b)});
    const add=el('<button class="add">+ Нов слайд</button>');add.onclick=()=>{st.slides.splice(st.cur+1,0,pSlide({layout:'content',trans:S().trans}));st.cur++;st.sel=null;draw()};thumbs.appendChild(add);
    stage.innerHTML=slideHTML(S(),true);
    const sl=$('.sl',stage);
    if(S().layout==='content'){const bo=$('.bo',sl);if(!bo.innerHTML.trim())bo.innerHTML='';}
    $$('[contenteditable]',sl).forEach(e=>{
      e.addEventListener('focus',()=>{st.sel=e.dataset.f;$$('.sel',sl).forEach(x=>x!==e&&x.classList.remove('sel'));e.classList.add('sel');rb.refresh()});
      e.addEventListener('input',()=>syncFrom(e));
      if(e.dataset.f==='body')e.addEventListener('input',()=>{if(e.querySelector('ul')||!e.textContent.trim())return;const lines=[];e.childNodes.forEach(n=>{const t=n.textContent;if(t.trim())lines.push(t)});e.innerHTML='<ul>'+lines.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';const r=document.createRange();r.selectNodeContents(e.querySelector('li:last-child'));r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);syncFrom(e)});
    });
    $$('.sh',sl).forEach(d=>{
      d.addEventListener('pointerdown',ev=>{ev.preventDefault();st.sel=d.dataset.id;$$('.sel',sl).forEach(x=>x.classList.remove('sel'));d.classList.add('sel');rb.refresh();
        const sh=selShape(),r=sl.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,ox=sh.x,oy=sh.y;d.setPointerCapture(ev.pointerId);
        d.onpointermove=m=>{sh.x=Math.max(-10,Math.min(95,ox+(m.clientX-sx)/r.width*100));sh.y=Math.max(-10,Math.min(95,oy+(m.clientY-sy)/r.height*100));d.style.left=sh.x+'%';d.style.top=sh.y+'%'};
        d.onpointerup=()=>{d.onpointermove=null;drawThumbs()}});
    });
    sl.addEventListener('pointerdown',e=>{if(e.target===sl){st.sel=null;$$('.sel',sl).forEach(x=>x.classList.remove('sel'));rb.refresh()}});

    const hold=$('.hold',ov);let order=[];

      if(withTrans&&s.trans!=='none')sl.classList.add('tr-'+s.trans);
      order=Object.entries(s.anim).filter(([k,v])=>v!=='none');step=0;
      order.forEach(([k])=>{const t=k==='title'?$('.ti',sl):k==='sub'?$('.su',sl):k==='body'?$('.bo',sl):$(`.sh[data-id="${k}"]`,sl);if(t)t.classList.add('an-wait')});
    }
    function next(){
      if(i>=st.slides.length){close();return}
      if(step<order.length){const [k,v]=order[step++];const sl=$('.sl',hold);const t=k==='title'?$('.ti',sl):k==='sub'?$('.su',sl):k==='body'?$('.bo',sl):$(`.sh[data-id="${k}"]`,sl);if(t){t.classList.remove('an-wait');t.classList.add('an-'+v)}return}

    }
    function close(){ov.remove();document.removeEventListener('keydown',key)}
    function key(e){if(e.key==='Escape')close();else if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();next()}else if(e.key==='ArrowLeft'&&i>0){i--;render(false)}}
    ov.onclick=e=>{if(e.target.classList.contains('esc'))return close();next()};
    document.addEventListener('keydown',key);
    render(true);
  }

 {id:'ppt6',title:'Преходи между слайдовете',plan:'Б2 2.15 – Преход на слайдовете',

 {id:'ppt7',title:'Анимации на обекти',plan:'Б2 2.15 – Анимационни схеми, потребителска анимация',

  goal:`<p>На слайд <b>2</b> сложете анимация <b>Влитане</b> на текста със списъка и анимация <b>Избледняване</b> на заглавието.</p>`,

 {id:'ppt8',title:'Прожекция на презентацията',plan:'А3 1.3.7 – Създаване на презентации',

  goal:`<p>Пуснете прожекцията <b>от началото</b> и я изгледайте <b>до края</b> (до черния екран „Край на прожекцията“).</p>`,
